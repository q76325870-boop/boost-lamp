name: Проверки
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pytest -q
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node --test --test-concurrency=1 tests/plugin.test.cjs
      - run: docker compose --env-file .env.example config --quiet
      - name: Сборка и запуск изолированного контейнера
        env:
          BOOSTY_LAN_IP: 127.0.0.1
          BOOSTY_PUBLIC_URL: http://127.0.0.1:19118
          BOOSTY_ORIGINS: http://127.0.0.1:9118
          BOOSTY_NETWORKS: 127.0.0.0/8
        run: |
          docker build -t boosty-lampa-boosty:latest .
          docker compose up -d --no-build --wait --wait-timeout 60
          docker compose exec -T boosty python -c "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=2))['ok']"
      - name: Очистка собственного тестового контейнера
        if: always()
        run: |
          docker compose --env-file .env.example down -v
