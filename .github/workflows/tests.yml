name: Проверки
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pytest -q
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node --test --test-concurrency=1 tests/plugin.test.cjs
      - run: docker compose --env-file .env.example config --quiet
      - name: Сборка и запуск изолированного контейнера
        run: |
          docker build -t boost-lamp:ci .
          docker run -d --name boost-lamp-ci --network none --cpus 0.5 --memory 512m --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m --mount type=volume,source=boost-lamp-ci-state,target=/state -e BOOSTY_PUBLIC_URL=http://127.0.0.1:8080 boost-lamp:ci
          for attempt in $(seq 1 15); do
            if docker exec boost-lamp-ci python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"; then break; fi
            sleep 1
          done
          docker exec boost-lamp-ci python -c "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=2))['ok']"
      - name: Очистка собственного тестового контейнера
        if: always()
        run: |
          docker rm -f boost-lamp-ci || true
          docker volume rm boost-lamp-ci-state || true
